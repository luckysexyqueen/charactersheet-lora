name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-space-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      HF_REPO: ChoLuckyHexSexySuccubusQueen135Age/charactersheet-lora-demo
    steps:
      - name: Checkout without unavailable Git LFS objects
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Check app source
        shell: bash
        run: |
          set -euo pipefail
          test -f app.py || { echo "::error::app.py is missing"; exit 1; }
          python -m py_compile app.py

      - name: Prepare safe Space upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hf-upload
          rsync -a ./ /tmp/hf-upload/ \
            --exclude='.git/' --exclude='.github/' \
            --exclude='.env' --exclude='.env.*' \
            --exclude='*.zip' --exclude='*.7z' --exclude='*.rar' \
            --exclude='__pycache__/' --exclude='*.pyc' \
            --exclude='.venv/' --exclude='venv/' \
            --exclude='node_modules/' --exclude='outputs/'
          python - <<'PY'
          from pathlib import Path
          root = Path("/tmp/hf-upload")
          marker = b"version https://git-lfs.github.com/spec/v1"
          missing = []
          for p in root.rglob("*"):
              if p.is_file():
                  with p.open("rb") as f:
                      if f.read(128).startswith(marker):
                          missing.append(str(p.relative_to(root)))
                          p.unlink()
          for name in missing:
              print("WARNING: unavailable Git LFS object skipped:", name)
          if not (root / "app.py").is_file():
              raise SystemExit("app.py unavailable after preparation")
          PY

      - name: Install Hugging Face client
        run: python -m pip install "huggingface_hub>=0.30,<2"

      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_TOKEN Actions secret is missing"; exit 1; }
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          repo = os.environ["HF_REPO"]
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.repo_info(repo_id=repo, repo_type="space")
          api.upload_folder(
              folder_path="/tmp/hf-upload",
              repo_id=repo,
              repo_type="space",
              commit_message="Sync CharacterSheet application from GitHub",
          )
          remote = set(api.list_repo_files(repo_id=repo, repo_type="space"))
          if "app.py" not in remote:
              raise RuntimeError("Space upload verification failed: app.py not found")
          print("Uploaded app.py to https://huggingface.co/spaces/" + repo)
          print("NOTE: Space build and GPU inference must be verified separately.")
          PY
